apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-options: Prune=false
    kubernetes.io/description: This Application allows Argo CD to manage itself.
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: local-cluster
  source:
    repoURL: https://github.com/cilindrox/terraform-eks
    targetRevision: main
    path: cluster-addons/argocd/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=false
    - FailOnSharedResource=true
    - ServerSideApply=true
