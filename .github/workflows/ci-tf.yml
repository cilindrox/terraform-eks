name: Terraform CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
    - main
    paths:
    - '**/*.tf'
  pull_request:
    branches:
    - main
    paths:
    - '**/*.tf'

permissions:
  contents: read

jobs:
  lint:
    name: Lint code base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_version: 1.17.1

    - name: Terraform Format Check
      run: terraform fmt -check -recursive -diff

    - name: Find and Validate Directories
      run: |
        dirs=$(find . -type f -name "*.tf" -not -path '*/.*' -exec dirname {} \; | sort -u)

        error_found=0

        for dir in $dirs; do
          echo "::group::validating: $dir"

          (
            cd "$dir" || exit 1
            terraform init -backend=false -input=false || exit 1
            terraform validate || exit 1
          ) || { echo "Validation failed in $dir"; error_found=1; }

          echo "::endgroup::"
        done

        if [ $error_found -ne 0 ]; then
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: 3.11

    - name: Test with Checkov
      id: checkov
      uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa
      with:
        directory: .
        framework: terraform
        output_format: cli
        output_file_path: console
        quiet: true
        download-external-modules: false
