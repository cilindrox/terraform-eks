apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  # ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability
  applicationsetcontroller.concurrent.reconciliations.max: '50'
  applicationsetcontroller.enable.new.git.file.globbing: 'true'
  applicationsetcontroller.k8s.client.burst: '400'
  applicationsetcontroller.k8s.client.max.idle.connections: '100'
  applicationsetcontroller.k8s.client.qps: '200'
  applicationsetcontroller.log.level: info
  applicationsetcontroller.webhook.parallelism.limit: '100'
  controller.diff.server.side: 'true'
  controller.operation.processors: '25'
  controller.repo.server.timeout.seconds: '240'
  controller.sharding.algorithm: legacy
  controller.status.processors: '50'
  controller.sync.timeout.seconds: '600'
  notificationscontroller.log.level: info
  reposerver.parallelism.limit: '10'
  reposerver.max.combined.directory.manifests.size: '2M'
