name: ci

# yamllint disable-line rule:truthy
on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint code base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Run Super-Linter
      uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854  # v9.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LOG_LEVEL: NOTICE
        SUPPRESS_POSSUM: true
        SAVE_SUPER_LINTER_SUMMARY: true
        ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
        ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
        TERRAFORM_TFLINT_CONFIG_FILE: .tflint.hcl
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_BIOME_FORMAT: false
        VALIDATE_JSCPD: false
        VALIDATE_MARKDOWN_PRETTIER: false
        VALIDATE_NATURAL_LANGUAGE: false
        VALIDATE_TERRAFORM_FMT: false
        VALIDATE_TERRAGRUNT: false
        VALIDATE_YAML_PRETTIER: false

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_version: 1.17.1

    - name: Terraform Format Check
      run: terraform fmt -check -recursive -diff

    - name: Find and Validate Directories
      run: |
        dirs=$(find . -type f -name "*.tf" -not -path '*/.*' -exec dirname {} \; | sort -u)

        error_found=0

        for dir in $dirs; do
          echo "::group::validating: $dir"

          (
            cd "$dir" || exit 1
            terraform init -backend=false -input=false || exit 1
            terraform validate || exit 1
          ) || { echo "Validation failed in $dir"; error_found=1; }

          echo "::endgroup::"
        done

        if [ $error_found -ne 0 ]; then
          exit 1
        fi
