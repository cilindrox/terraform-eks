apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: local-cluster
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: Manage the in-cluster Argo CD and components
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  sourceRepos:
  - https://github.com/cilindrox/terraform-eks
  orphanedResources:
    warn: true
